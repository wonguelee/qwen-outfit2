name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. 자바 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Gradle 8.11.1 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 4. 안드로이드 SDK 부품 준비
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

      - name: 5. 올린 zip 파일 자동으로 풀기
        run: |
          set -e
          shopt -s nullglob
          for z in *.zip; do
            echo "압축 풀기: $z"
            unzip -o "$z"
          done
          if [ -d QwenOutfitStudio ] && [ ! -f settings.gradle.kts ]; then
            cp -r QwenOutfitStudio/. .
          fi
          echo "--- 현재 폴더 ---"
          ls -la

      - name: 6. 옷 인식 모델 내려받기 (앱에 자동 포함)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets
          TARGET="app/src/main/assets/selfie_multiclass_256x256.tflite"
          URL="https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite"
          if [ ! -s "$TARGET" ]; then
            curl -fL --retry 3 --retry-delay 2 -o "$TARGET" "$URL" || echo "모델 내려받기 실패 — 자동 선택만 못 쓰고 나머지는 정상 동작"
          fi
          ls -la app/src/main/assets || true

      - name: 7. APK 조립
        run: gradle --no-daemon assembleDebug

      - name: 8. APK 올려두기
        uses: actions/upload-artifact@v4
        with:
          name: QwenOutfitStudio-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
